
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtVista | Experiment 09</title>

    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
        }

        .app-root {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            transition: 0.3s;
        }

        .app-root.light {
            --bg: #f8f3e9;
            --card: #ffffff;
            --text: #4b1e24;
            --secondary: #79565a;
            --border: #e5bd78;
            --accent: #702d36;
            --gold: #c49a59;
        }

        .app-root.dark {
            --bg: #211719;
            --card: #342528;
            --text: #f8e9d0;
            --secondary: #d0b9a8;
            --border: #79565a;
            --accent: #a65c61;
            --gold: #e5bd78;
        }

        header {
            background: #4b1e24;
            color: #e5bd78;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h2 {
            letter-spacing: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .theme-btn {
            padding: 10px 16px;
            background: transparent;
            border: 1px solid #e5bd78;
            color: #e5bd78;
            cursor: pointer;
            font-family: inherit;
        }

        .hero {
            text-align: center;
            padding: 45px 15px 30px;
        }

        .hero h1 {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .hero p {
            color: var(--secondary);
        }

        .container {
            width: 88%;
            max-width: 1200px;
            margin: auto;
            padding-bottom: 50px;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 24px;
            transition: transform 0.2s;
        }

        .stat-card:hover,
        .art-card:hover {
            transform: translateY(-4px);
        }

        .stat-card p {
            color: var(--secondary);
            margin-bottom: 12px;
        }

        .stat-card h2 {
            color: var(--gold);
            font-size: 29px;
        }

        .gallery-section {
            margin-bottom: 35px;
        }

        .art-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 22px;
        }

        .art-card {
            background: var(--card);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: 0.2s;
        }

        .art-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .art-info {
            padding: 17px;
        }

        .art-info h3 {
            margin-bottom: 8px;
        }

        .art-info p {
            color: var(--secondary);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .art-price {
            color: var(--gold);
            font-weight: bold;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .action-btn {
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-family: inherit;
        }

        .favorite-btn {
            background: #f8e7e5;
            color: #702d36;
        }

        .delete-btn {
            background: #702d36;
            color: white;
        }

        .add-section {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 25px;
        }

        .add-section h2 {
            margin-bottom: 20px;
        }

        .art-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .art-form input {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
        }

        .add-btn {
            background: #4b1e24;
            color: #e5bd78;
            border: none;
            padding: 13px;
            cursor: pointer;
            font-family: inherit;
        }

        .empty {
            color: var(--secondary);
            padding: 20px 0;
        }

        .status-message {
            margin-top: 15px;
            color: var(--gold);
        }

        footer {
            background: #4b1e24;
            color: #e5bd78;
            padding: 20px;
            text-align: center;
        }

        @media(max-width: 600px) {
            header {
                padding: 18px 5%;
            }

            .header-right {
                flex-wrap: wrap;
            }

            .hero h1 {
                font-size: 27px;
            }

            .container {
                width: 92%;
            }

            .art-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { useState } = React;

// Reusable Header Component
function Header({ theme, toggleTheme }) {
    return (
        <header>
            <h2>ArtVista</h2>

            <div className="header-right">
                <span>Art Gallery Dashboard</span>

                <button className="theme-btn" onClick={toggleTheme}>
                    {theme === "light" ? "Dark Mode" : "Light Mode"}
                </button>
            </div>
        </header>
    );
}

// Reusable Statistics Card
function StatCard({ title, value }) {
    return (
        <div className="stat-card">
            <p>{title}</p>
            <h2>{value}</h2>
        </div>
    );
}

// Artwork List Component
function ArtworkList({ artworks, onDelete, onFavorite }) {
    return (
        <div className="art-grid">

            {artworks.length === 0 ? (
                <p className="empty">No artworks available.</p>
            ) : (

                artworks.map((art) => (
                    <div className="art-card" key={art.id}>

                        <img
                            src={art.image || "https://placehold.co/600x400?text=Artwork"}
                            alt={art.title}
                        />

                        <div className="art-info">

                            <h3>{art.title}</h3>

                            <p>Artist: {art.artist}</p>

                            <p>Category: {art.category}</p>

                            <div className="art-price">
                                ₹{Number(art.price).toLocaleString("en-IN")}
                            </div>

                            <div className="card-actions">

                                <button
                                    className="action-btn favorite-btn"
                                    onClick={() => onFavorite(art.id)}
                                >
                                    {art.favorite ? "♥ Saved" : "♡ Favourite"}
                                </button>

                                <button
                                    className="action-btn delete-btn"
                                    onClick={() => onDelete(art.id)}
                                >
                                    Delete
                                </button>

                            </div>
                        </div>
                    </div>
                ))

            )}

        </div>
    );
}

// Main Application Component
function App() {

    const [theme, setTheme] = useState("light");

    const [artworks, setArtworks] = useState([
        {
            id: 1,
            title: "Starry Night",
            artist: "Vincent van Gogh",
            category: "Painting",
            price: 25000,
            image: "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=600",
            favorite: true
        },
        {
            id: 2,
            title: "Abstract Dreams",
            artist: "Modern Artist",
            category: "Abstract",
            price: 18000,
            image: "https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=600",
            favorite: false
        },
        {
            id: 3,
            title: "Classic Portrait",
            artist: "Gallery Collection",
            category: "Portrait",
            price: 15000,
            image: "https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?w=600",
            favorite: false
        }
    ]);

    const [title, setTitle] = useState("");
    const [artist, setArtist] = useState("");
    const [category, setCategory] = useState("");
    const [price, setPrice] = useState("");
    const [image, setImage] = useState("");
    const [message, setMessage] = useState("");

    // Switch between light and dark themes
    const toggleTheme = () => {
        setTheme((previous) =>
            previous === "light" ? "dark" : "light"
        );
    };

    // Add new artwork
    const handleAddArtwork = (event) => {
        event.preventDefault();

        if (!title.trim() || !artist.trim() ||
            !category.trim() || price === "" ||
            Number(price) < 0) {
            setMessage("Please enter valid artwork details.");
            return;
        }

        const newArtwork = {
            id: Date.now(),
            title: title.trim(),
            artist: artist.trim(),
            category: category.trim(),
            price: Number(price),
            image: image.trim(),
            favorite: false
        };

        setArtworks((previous) => [...previous, newArtwork]);

        setTitle("");
        setArtist("");
        setCategory("");
        setPrice("");
        setImage("");

        setMessage("Artwork added successfully!");
    };

    // Delete artwork
    const handleDelete = (id) => {
        setArtworks((previous) =>
            previous.filter((art) => art.id !== id)
        );
    };

    // Mark artwork as favourite
    const handleFavorite = (id) => {
        setArtworks((previous) =>
            previous.map((art) =>
                art.id === id
                    ? { ...art, favorite: !art.favorite }
                    : art
            )
        );
    };

    const totalArtworks = artworks.length;

    const favoriteCount = artworks.filter(
        (art) => art.favorite
    ).length;

    const totalValue = artworks.reduce(
        (total, art) => total + Number(art.price), 0
    );

    return (
        <div className={`app-root ${theme}`}>

            <Header
                theme={theme}
                toggleTheme={toggleTheme}
            />

            <section className="hero">
                <h1>ArtVista Gallery Dashboard</h1>
                <p>Manage, explore and celebrate beautiful artworks.</p>
            </section>

            <main className="container">

                {/* Statistics */}
                <section className="stats-grid">

                    <StatCard
                        title="Total Artworks"
                        value={totalArtworks}
                    />

                    <StatCard
                        title="Favourite Artworks"
                        value={favoriteCount}
                    />

                    <StatCard
                        title="Total Collection Value"
                        value={"₹" + totalValue.toLocaleString("en-IN")}
                    />

                </section>

                {/* Gallery */}
                <section className="gallery-section">

                    <h2 className="section-title">
                        Our Art Collection
                    </h2>

                    <ArtworkList
                        artworks={artworks}
                        onDelete={handleDelete}
                        onFavorite={handleFavorite}
                    />

                </section>

                {/* Add Artwork Form */}
                <section className="add-section">

                    <h2>Add New Artwork</h2>

                    <form
                        className="art-form"
                        onSubmit={handleAddArtwork}
                    >

                        <input
                            type="text"
                            placeholder="Artwork Title"
                            value={title}
                            onChange={(e) => setTitle(e.target.value)}
                            required
                        />

                        <input
                            type="text"
                            placeholder="Artist Name"
                            value={artist}
                            onChange={(e) => setArtist(e.target.value)}
                            required
                        />

                        <input
                            type="text"
                            placeholder="Artwork Category"
                            value={category}
                            onChange={(e) => setCategory(e.target.value)}
                            required
                        />

                        <input
                            type="number"
                            min="0"
                            placeholder="Artwork Price"
                            value={price}
                            onChange={(e) => setPrice(e.target.value)}
                            required
                        />

                        <input
                            type="url"
                            placeholder="Artwork Image URL (optional)"
                            value={image}
                            onChange={(e) => setImage(e.target.value)}
                        />

                        <button className="add-btn" type="submit">
                            + Add Artwork
                        </button>

                    </form>

                    <p className="status-message">{message}</p>

                </section>

            </main>

            <footer>
                <p>© 2026 ArtVista Art Gallery | Experiment 09</p>
            </footer>

        </div>
    );
}

// Render React Application
const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(<App />);

</script>

</body>
</html>
